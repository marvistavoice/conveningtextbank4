<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MVV Textbank — Foundational Documents</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#192c28;background:#f5f7f5}body{max-width:820px;margin:30px auto;padding:0 18px}h1{font-size:1.7rem}p{line-height:1.5}.meta{color:#52635e}.fields{display:flex;gap:12px;flex-wrap:wrap}label{display:grid;gap:5px;font-weight:600}input{padding:10px;border:1px solid #9caea6;border-radius:8px;font:inherit}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:22px 0 12px}button{cursor:pointer;padding:10px 14px;border:1px solid #537466;border-radius:8px;background:white;font:inherit}button[aria-pressed=true],#copy{background:#175f49;color:white}.panel{border:1px solid #d5dfd9;border-radius:12px;padding:20px;background:white}.message{white-space:pre-wrap;line-height:1.6;font-size:1.05rem}.note{font-size:.9rem;color:#53615b;margin-top:12px}#copy{margin-top:16px}.warning{background:#fff7e7;padding:10px;border-radius:8px}</style></head>
<body><h1>MVV Foundational Documents — Textbank</h1><p class="meta">Outreach: Oct. 26–30, 2026 · Convening: Sun. Nov. 8, 4–5:30 PM on Zoom</p><p class="warning"><strong>Voting:</strong> Everyone invited can vote Nov. 15–22, whether or not they attend or send feedback. Feedback is optional.</p>
<div class="fields"><label>Texter name<input id="texter" placeholder="Your name"></label><label>Recipient name<input id="recipient" placeholder="Recipient name"></label></div>
<div class="tabs" id="tabs"></div><section class="panel"><h2 id="heading"></h2><div class="message" id="message"></div><button id="copy">Copy message</button><div class="note" id="action"></div></section>
<p class="note">This tool doesn't collect or save names or responses.</p>
<script>
const DOC='https://docs.google.com/document/d/1Ie-3gXFta3Zs2lk3rAzI83zS8ctR5oufh8Z9G3HKzgw/edit?usp=sharing';
const branches=[
['Initial text',`Hi [Name]! It's [Texter Name] from Mar Vista Voice! We're getting together on Zoom Sunday, Nov. 8, from 4–5:30 PM to review and discuss our foundational docs (mission, guiding principles, and how MVV will be organized) before we vote to adopt them. We'd love your input as we shape MVV's next chapter! Think you can make it? You can RSVP here: https://luma.com/v16r15ct`,'Send first; track their reply.'],
['YES',`Great! So glad you can join! Please use the link below to RSVP and we'll send the Zoom details and documents ahead of the meeting. Looking forward to hearing your thoughts!\n\nhttps://luma.com/v16r15ct`,'Mark YES.'],
['NO',`No worries! You can still vote on the documents even if you can't make the meeting! We'll send out the revised versions on Nov. 15, and voting will be open through Nov. 22. In the meantime, we'd love any thoughts or suggestions you have. Here's a link to the proposed docs: ${DOC}`,'Mark NO.'],
['MAYBE',`Totally understand! Hope you can make it! Even if you can't, you'll still be able to vote Nov. 15–22. In the meantime, feel free to take a look at the proposed docs and send us any thoughts or suggestions before Nov. 8: ${DOC}`,'Mark MAYBE and flag for follow-up.'],
['Who can vote?',`For this process, everyone invited can participate in the vote. You don't have to be an active member under the new structure, and you can vote even if you can't attend or send feedback. Voting will take place Nov. 15–22.`,'Answer eligibility question.'],
['What are the docs?',`They're the documents that will guide how MVV operates going forward, including our mission, our shared values and principles, how we make decisions, and how people can get involved and take on leadership. We've been working on them together over the past few months, and now we're ready to review and adopt them as an organization.\n\n${DOC}`,'Share the documents.'],
['How to give feedback?',`You can review the proposed documents and send us your comments or suggestions by Nov. 8 to marvistavoice@gmail.com. We'd love your input even if you can't join the Zoom meeting! Feedback is optional and isn't required to vote.\n\n${DOC}`,'Share feedback instructions.']
];
let selected=0;const tabs=document.getElementById('tabs');branches.forEach((b,i)=>{const btn=document.createElement('button');btn.textContent=b[0];btn.onclick=()=>{selected=i;render()};tabs.append(btn)});
function getMessage(){return branches[selected][1].replaceAll('[Name]',document.getElementById('recipient').value.trim()||'[Name]').replaceAll('[Texter Name]',document.getElementById('texter').value.trim()||'[Texter Name]')}
function render(){[...tabs.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));document.getElementById('heading').textContent=branches[selected][0];document.getElementById('message').textContent=getMessage();document.getElementById('action').textContent='Texter action: '+branches[selected][2]}
document.querySelectorAll('input').forEach(x=>x.addEventListener('input',render));document.getElementById('copy').onclick=async()=>{const s=getMessage();try{await navigator.clipboard.writeText(s)}catch(e){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove()}document.getElementById('copy').textContent='Copied!';setTimeout(()=>document.getElementById('copy').textContent='Copy message',1200)};render();
</script></body></html>
